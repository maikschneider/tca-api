categories:

  TcaApi: ~

  TcaApi.general:
    parent: TcaApi

  TcaApi.apiSpec:
    parent: TcaApi

  TcaApi.cors:
    parent: TcaApi

settings:

  tca_api.enabled:
    category: TcaApi.general
    type: bool
    default: true

  tca_api.apiPrefix:
    category: TcaApi.general
    type: string
    default: '/_api/'

  tca_api.defaultItemsPerPage:
    category: TcaApi.general
    type: int
    default: 20

  tca_api.allowedResources:
    category: TcaApi.general
    type: string
    default: ''

  tca_api.debugMode:
    category: TcaApi.general
    type: bool
    default: false

  tca_api.openApiExposed:
    category: TcaApi.apiSpec
    type: string
    enum:
      PUBLIC: 'Public (everyone)'
      FE_USER: 'Frontend users'
      BE_USER: 'Backend users'
      BE_ADMIN: 'Backend admins'
      API_KEY: 'Requests with an API key or token'
      NONE: 'Disabled'
    default: 'PUBLIC'

  tca_api.apiSpecTitle:
    category: TcaApi.apiSpec
    type: string
    default: 'TCA API'

  tca_api.apiSpecDescription:
    category: TcaApi.apiSpec
    type: string
    default: ''

  tca_api.apiSpecVersion:
    category: TcaApi.apiSpec
    type: string
    default: '1.0.0'

  tca_api.swaggerUiEnabled:
    category: TcaApi.apiSpec
    type: string
    enum:
      PUBLIC: 'Public (everyone)'
      FE_USER: 'Frontend users'
      BE_USER: 'Backend users'
      BE_ADMIN: 'Backend admins'
      NONE: 'Disabled'
    default: 'PUBLIC'

  tca_api.corsEnabled:
    category: TcaApi.cors
    type: bool
    default: false

  tca_api.corsOrigin:
    category: TcaApi.cors
    type: string
    default: '*'

  tca_api.corsAllowHeaders:
    category: TcaApi.cors
    type: string
    default: ''

  tca_api.corsAllowCredentials:
    category: TcaApi.cors
    type: bool
    default: false
