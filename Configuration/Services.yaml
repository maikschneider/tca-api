services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  MaikSchneider\TcaApi\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/ConfigurationModuleProvider/'
      # Registered conditionally in Services.php — depends on v14-only backend API.
      - '../Classes/Controller/'
      # Registered conditionally in Services.php — depends on the optional api_key extension.
      - '../Classes/Integration/ApiKey/'

  _instanceof:
    MaikSchneider\TcaApi\OperationHandler\OperationHandlerInterface:
      tags: ['tca_api.operation_handler']

  MaikSchneider\TcaApi\Security\TableAccessControl:
    arguments:
      $allowList: []
      $denyList: []

  MaikSchneider\TcaApi\Serializer\Processing\PlaceholderResolver:
    public: true

  # ── Cache services ─────────────────────────────────────────────────
  cache.tca_api:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['tca_api']

  MaikSchneider\TcaApi\Cache\CacheTagCollector:
    public: true

  MaikSchneider\TcaApi\Cache\CacheInvalidationHook:
    public: true
    arguments:
      $cache: '@cache.tca_api'

  MaikSchneider\TcaApi\Cache\WriteCacheInvalidationListener:
    public: true
    arguments:
      $cache: '@cache.tca_api'
    tags:
      - name: event.listener
        event: MaikSchneider\TcaApi\Event\AfterWriteEvent
        method: __invoke

  MaikSchneider\TcaApi\Loader\ApiDefinitionLoader:
    public: true
    tags:
      - name: event.listener
        event: TYPO3\CMS\Core\Core\Event\BootCompletedEvent
        method: __invoke

  MaikSchneider\TcaApi\Dispatcher\RequestDispatcher:
    arguments:
      $cache: '@cache.tca_api'
