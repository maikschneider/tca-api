name: Tests

on:
  push:
    branches:
      - main
      - 'renovate/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        typo3-version: ["13.4", "14.0"]
        php-version: ["8.2", "8.3", "8.4"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup DDEV
      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Configure and start DDEV
        run: |
          ddev config --project-type=typo3 --php-version=${{ matrix.php-version }}
          ddev start

      # Install dependencies
      - name: Install Composer dependencies
        run: |
          ddev composer config github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          ddev composer update --with=typo3/cms-core:"^${{ matrix.typo3-version }}"

      # Install npm dependencies (spectral for OpenAPI validation)
      - name: Install npm dependencies
        run: ddev exec npm install

      # Init TYPO3
      - name: Init TYPO3
        run: ddev init-typo3

      # Enable Xdebug for code coverage
      - name: Enable Xdebug
        run: ddev xdebug on

      # Run tests with coverage
      - name: Run functional tests
        run: ddev exec XDEBUG_MODE=coverage vendor/bin/phpunit --configuration phpunit.xml --coverage-clover coverage.xml

      # Report coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: functional,php${{ matrix.php-version }},typo3-${{ matrix.typo3-version }}
