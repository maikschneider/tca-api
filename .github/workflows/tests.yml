name: Tests

on:
  push:
    branches:
      - main
      - 'renovate/**'
  # Every base branch, so stacked PRs are tested before they are retargeted to main.
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typo3-version: [ "13.4", "14.3" ]
        php-version: [ "8.2", "8.3", "8.4" ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install Composer dependencies
        run: composer update --with=typo3/cms-core:"^${{ matrix.typo3-version }}"

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit

  functional-tests:
    name: Functional (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typo3-version: ["13.4", "14.3"]
        php-version: ["8.2", "8.3", "8.4"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Configure and start DDEV
        run: |
          ddev config --project-type=typo3 --php-version=${{ matrix.php-version }}
          ddev start

      - name: Install Composer dependencies
        run: |
          ddev composer config github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          ddev composer update --with=typo3/cms-core:"^${{ matrix.typo3-version }}"

      - name: Install npm dependencies
        run: ddev exec npm install

      - name: Init TYPO3
        run: ddev init-typo3

      - name: Run functional tests
        run: ddev exec CI=true vendor/bin/phpunit --testsuite Functional

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Configure and start DDEV
        run: |
          ddev config --project-type=typo3 --php-version=8.4
          ddev start

      - name: Install Composer dependencies
        run: |
          ddev composer config github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          ddev composer update --with=typo3/cms-core:"^14.3"

      - name: Install npm dependencies
        run: ddev exec npm install

      - name: Init TYPO3
        run: ddev init-typo3

      # Types generated from the spec must fit typical client code (#274): this
      # catches schemas that are too loose, which response validation can't.
      - name: Type-check a client generated from the spec
        run: |
          ddev exec mkdir -p Tests/Client/generated
          ddev exec vendor/bin/typo3 tca-api:openapi main --output Tests/Client/generated/openapi.json
          ddev exec npm run client:check

      - name: Enable Xdebug
        run: ddev xdebug on

      - name: Run unit tests with coverage
        run: ddev exec XDEBUG_MODE=coverage vendor/bin/phpunit --testsuite Unit --coverage-clover coverage.unit.xml

      - name: Run functional tests with coverage
        run: ddev exec CI=true XDEBUG_MODE=coverage vendor/bin/phpunit --testsuite Functional --coverage-clover coverage.functional.xml

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.unit.xml
          flags: unit
          disable_search: true
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Upload functional coverage to Codecov
        uses: codecov/codecov-action@v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.functional.xml
          flags: functional
          disable_search: true
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
