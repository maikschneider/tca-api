name: Tests

on:
  push:
    branches:
      - main
      - 'renovate/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install Composer dependencies
        run: composer update --with=typo3/cms-core:"^14.0"

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite Unit

  functional-tests:
    name: Functional (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typo3-version: ["13.4", "14.0"]
        php-version: ["8.2", "8.3", "8.4"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Configure and start DDEV
        run: |
          ddev config --project-type=typo3 --php-version=${{ matrix.php-version }}
          ddev start

      - name: Install Composer dependencies
        run: |
          ddev composer config github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}
          ddev composer update --with=typo3/cms-core:"^${{ matrix.typo3-version }}"

      - name: Install npm dependencies
        run: ddev exec npm install

      - name: Init TYPO3
        run: ddev init-typo3

      - name: Enable Xdebug
        if: matrix.php-version == '8.4' && matrix.typo3-version == '14.0'
        run: ddev xdebug on

      - name: Run functional tests with coverage
        if: matrix.php-version == '8.4' && matrix.typo3-version == '14.0'
        run: ddev exec XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Run functional tests
        if: "!(matrix.php-version == '8.4' && matrix.typo3-version == '14.0')"
        run: ddev exec vendor/bin/phpunit

      - name: Upload coverage reports to Codecov
        if: matrix.php-version == '8.4' && matrix.typo3-version == '14.0'
        uses: codecov/codecov-action@v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: functional
